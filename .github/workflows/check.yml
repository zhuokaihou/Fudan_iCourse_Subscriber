name: iCourse Check (temporary API verification)
on:
  workflow_dispatch:
permissions: {}
jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify DeepSeek with a synthetic prompt
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          
          key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          if not key:
              raise SystemExit("DEEPSEEK_API_KEY is missing")
          headers = {"Authorization": "Bearer " + key, "Content-Type": "application/json"}
          
          def call(path, payload=None):
              req = urllib.request.Request(
                  "https://api.deepseek.com" + path,
                  headers=headers,
                  data=None if payload is None else json.dumps(payload).encode("utf-8"),
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"DeepSeek {path} returned HTTP {error.code}") from None
              except (urllib.error.URLError, TimeoutError, ValueError):
                  raise SystemExit(f"DeepSeek {path} could not be verified") from None
          
          balance = call("/user/balance")
          print("DeepSeek API authentication: OK", flush=True)
          if not balance.get("is_available"):
              raise SystemExit("DeepSeek reports that this API account cannot be charged")
          print("DeepSeek API balance is available", flush=True)
          completion = call("/v1/chat/completions", {
              "model": "deepseek-v4-flash",
              "messages": [{"role": "user", "content": "Reply with OK."}],
              "thinking": {"type": "disabled"},
              "max_tokens": 16,
          })
          if not completion.get("choices", [{}])[0].get("message", {}).get("content"):
              raise SystemExit("DeepSeek did not return a completion")
          print("DeepSeek chat completion: OK", flush=True)
          PY
